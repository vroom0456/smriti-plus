<script>
  (function() {
    const cards = document.querySelectorAll('.choice-card');
    const counterBadge = document.getElementById('counter-badge');
    const submitText = document.getElementById('submit-text');
    const readAloudBtn = document.getElementById('read-aloud-btn');

    function updateState() {
      const selectedCards = document.querySelectorAll('.choice-card[aria-checked="true"]');
      const count = selectedCards.length;
      
      if (counterBadge) {
        counterBadge.textContent = `${count} of 4 remembered`;
      }
      
      if (submitText) {
        submitText.textContent = `Submit Answers (${count} Selected)`;
      }
    }

    cards.forEach(card => {
      card.addEventListener('click', () => {
        const isChecked = card.getAttribute('aria-checked') === 'true';
        const newCheckedState = !isChecked;
        
        card.setAttribute('aria-checked', String(newCheckedState));
        
        const titleEl = card.querySelector('.truncate');
        const indicator = card.querySelector('.checkbox-indicator');

        if (newCheckedState) {
          // Selected Visual State
          card.classList.remove('bg-surface-container-lowest');
          card.classList.add('bg-surface-container-highest');
          
          if (titleEl) {
            titleEl.classList.remove('text-on-surface');
            titleEl.classList.add('text-primary');
          }

          if (indicator) {
            indicator.className = "checkbox-indicator w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center flex-shrink-0 shadow-sm";
            indicator.innerHTML = `<span class="material-symbols-outlined text-[26px]">check</span>`;
          }
        } else {
          // Unselected Visual State
          card.classList.remove('bg-surface-container-highest');
          card.classList.add('bg-surface-container-lowest');
          
          if (titleEl) {
            titleEl.classList.remove('text-primary');
            titleEl.classList.add('text-on-surface');
          }

          if (indicator) {
            indicator.className = "checkbox-indicator w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center flex-shrink-0";
            indicator.innerHTML = `<span class="material-symbols-outlined text-[24px] opacity-40">circle</span>`;
          }
        }

        updateState();
      });
    });

    if (readAloudBtn) {
      readAloudBtn.addEventListener('click', () => {
        readAloudBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
        setTimeout(() => {
          readAloudBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
        }, 1200);
      });
    }

    // Set initial count accurately
    updateState();
  })();
</script></main></body></html>
